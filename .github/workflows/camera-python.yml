name: Camera Python - pruebas unitarias
on:
  push:
    branches: [feat/camaras-ocr]
    paths:
      - 'camera_service/**'
      - '.github/workflows/camera-python.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probar Facade, OCR por IR y adaptadores sin hardware
        run: python -m unittest discover -s camera_service/tests -v
